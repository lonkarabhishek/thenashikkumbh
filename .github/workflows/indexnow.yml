name: IndexNow ping after production deploy

# Vercel reports each deployment to GitHub. When a Production deployment
# succeeds, submit recently changed URLs to IndexNow (Bing and others).
on:
  deployment_status:

jobs:
  indexnow:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/indexnow.mjs
